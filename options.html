<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HappySubs</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 32px 24px 48px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Microsoft YaHei", Roboto, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 28px; }
    h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .6;
      margin: 32px 0 12px;
      font-weight: 600;
    }
    section { border-top: 1px solid color-mix(in srgb, CanvasText 14%, transparent); padding-top: 4px; }
    section:first-of-type { border-top: 0; }
    .row { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
    .row label:first-child { min-width: 120px; }
    select {
      font: inherit;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Field;
      color: FieldText;
    }
    .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch input { width: 16px; height: 16px; }
    .note { opacity: .65; font-size: 13px; margin: 8px 0 0; }
    #saved {
      opacity: 0;
      transition: opacity .15s;
      font-size: 13px;
      color: color-mix(in srgb, CanvasText 60%, transparent);
    }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1><span data-i18n="optionsTitle">HappySubs 设置</span> <span id="saved" data-i18n="saved">已保存</span></h1>

    <section>
      <h2 data-i18n="interfaceSection">界面</h2>
      <div class="row">
        <label for="uiLang" data-i18n="interfaceLanguage">面板语言</label>
        <select id="uiLang">
          <option value="auto" data-i18n="langAuto">跟随浏览器</option>
          <option value="zh" data-i18n="langZh">中文</option>
          <option value="en" data-i18n="langEn">English</option>
        </select>
      </div>
      <p class="note" data-i18n="langNote">作用于插件弹窗、本页面，以及视频上弹出的提示。</p>
    </section>

    <section>
      <h2 data-i18n="behaviourSection">默认行为</h2>
      <div class="row">
        <label class="switch"><input type="checkbox" id="enabled" /> <span data-i18n="enable">启用</span></label>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" id="translationOnly" /> <span data-i18n="translationOnly">仅显示翻译字幕（不用开原生字幕）</span></label>
      </div>
      <p class="note" data-i18n="behaviourNote">这两个开关和弹窗里是同一个——设置会跨视频、跨重启保留，所以在这里设成什么，每个视频打开时就是什么。</p>
    </section>

    <section>
      <p class="note" data-i18n="openPopupNote">第二语言、翻译源、API Key 和字幕样式在工具栏弹窗里设置。</p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
