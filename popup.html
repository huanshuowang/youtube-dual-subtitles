<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HappySubs</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px 14px 16px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .tabs { display: flex; gap: 4px; margin: 10px 0 12px; border-bottom: 1px solid rgba(128,128,128,0.3); }
    .tabs button {
      flex: 1 1 0; padding: 7px 6px; font: inherit; cursor: pointer;
      background: transparent; border: 0; border-bottom: 2px solid transparent;
      color: inherit; opacity: 0.6;
    }
    .tabs button[aria-selected="true"] { opacity: 1; font-weight: 600; border-bottom-color: currentColor; }
    .panel[hidden] { display: none; }
    .liveStatus { font-size: 12px; opacity: 0.75; margin: 8px 0; line-height: 1.5; }
    .scopeNote { font-size: 12px; opacity: 0.62; line-height: 1.5; margin: 0 0 8px; }
    .liveStatus a { color: inherit; }
    #liveToggle { width: 100%; padding: 9px; font: inherit; cursor: pointer; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 8px; }
    .row label { flex: 0 0 auto; }
    .row select, .row input[type="color"], .row input[type="number"], .row input[type="password"], .row input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(127,127,127,0.4);
      background: transparent;
      color: inherit;
    }
    .apiKeyWrap { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; }
    .apiKeyWrap input { width: 100%; }
    .apiKeyWrap input:disabled { opacity: 0.72; background: rgba(127,127,127,0.12); cursor: pointer; }
    .keyState { flex: 0 0 auto; min-width: 20px; text-align: center; font-size: 14px; }
    .keyState.ok { color: #24a148; }
    .keyState.missing { color: #d97706; }
    .keyEdit {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 4px;
      border: 1px solid rgba(127,127,127,0.4);
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
    }
    .muted { color: #888; font-size: 12px; }
    .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: rgba(127,127,127,0.12); font-size: 12px; }
    .switch { display: inline-flex; align-items: center; gap: 6px; }
    .apihelp { margin: -4px 0 6px 0; font-size: 11.5px; color: #888; text-align: right; }
    .apihelp a { color: inherit; }
    .paidControls { display: none; margin: 6px 0 2px; }
    .paidControls button {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid rgba(127,127,127,0.45);
      background: rgba(62,166,255,0.16);
      color: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .askRow { display: none; justify-content: flex-start; }
    hr { border: none; border-top: 1px solid rgba(127,127,127,0.2); margin: 12px 0 8px; }
  </style>
</head>
<body>
  <h1 data-i18n="appTitle">HappySubs</h1>

  <div class="row">
    <label class="switch"><input type="checkbox" id="enabled" /> <span data-i18n="enable">启用</span></label>
    <span class="muted" id="videoInfo"></span>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" id="tabTranslate" role="tab" aria-selected="true" data-i18n="tabTranslate">直接翻译</button>
    <button type="button" id="tabLive" role="tab" aria-selected="false" data-i18n="tabLive">实时听译</button>
  </div>

  <div class="panel" id="panelLive" hidden>
    <div class="scopeNote" data-i18n="liveScope">三个平台都能用；主要是给 B站——那里大部分视频没有字幕轨。需要先装本地识别服务。</div>
    <button type="button" id="liveToggle" data-i18n="liveStart">开启实时听译</button>
    <div class="liveStatus" id="liveStatus"></div>
  </div>

  <div class="panel" id="panelTranslate">

  <div class="scopeNote" data-i18n="translateScope">支持 YouTube、Vimeo、B站，包括嵌在其他网站里的 Vimeo 播放器。</div>

  <div class="row">
    <label class="switch"><input type="checkbox" id="translationOnly" /> <span data-i18n="translationOnly">仅显示翻译字幕（不用开原生字幕）</span></label>
  </div>

  <div class="row">
    <label for="lang" data-i18n="secondLanguage">第二语言</label>
    <select id="lang"></select>
  </div>

  <div class="row">
    <label for="provider" data-i18n="translationSource">翻译源</label>
    <select id="provider">
      <option value="google" data-i18n="providerGoogle">Google Translate（免费）</option>
      <option value="claude" data-i18n="providerClaude">Claude Haiku · 高质量</option>
      <option value="openai" data-i18n="providerOpenai">OpenAI GPT-4o mini · 高质量</option>
      <option value="gemini" data-i18n="providerGemini">Google Gemini · 有免费额度</option>
      <option value="deepseek" data-i18n="providerDeepseek">DeepSeek · 高性价比</option>
    </select>
  </div>

  <div class="row" id="apiKeyRow" style="display:none;">
    <label for="apiKey">API Key</label>
    <div class="apiKeyWrap">
      <input type="password" id="apiKey" placeholder="粘贴到这里" autocomplete="off" spellcheck="false" />
      <span id="apiKeyState" class="keyState" title="API Key 状态"></span>
      <button type="button" id="editApiKey" class="keyEdit">编辑</button>
    </div>
  </div>
  <div class="apihelp" id="apiKeyHelp" style="display:none;">
    <a id="apiKeyLink" href="#" target="_blank" rel="noopener">获取 key →</a>
  </div>
  <div class="paidControls" id="paidControls">
    <button type="button" id="usePaidApi" data-i18n="usePaidApiBtnGeneric">本视频使用所选 API 翻译</button>
  </div>
  <div class="row askRow" id="askPaidRow">
    <label class="switch"><input type="checkbox" id="askPaidApi" /> <span data-i18n="askEachVideo">每次打开视频自动询问是否使用付费 API</span></label>
  </div>

  </div><!-- /panelTranslate -->

  <hr />
  <!-- Everything below applies to both tabs: one overlay, one set of styling. -->

  <div class="row">
    <label for="bottomOffset" data-i18n="verticalPosition">垂直位置</label>
    <input type="range" id="bottomOffset" min="0" max="90" step="1" />
    <span class="muted" id="bottomOffsetVal" style="flex:0 0 auto; min-width:36px; text-align:right;"></span>
  </div>

  <div class="row">
    <label for="captionWidth" data-i18n="captionWidth">字幕宽度</label>
    <input type="range" id="captionWidth" min="20" max="100" step="5" />
    <span class="muted" id="captionWidthVal" style="flex:0 0 auto; min-width:36px; text-align:right;"></span>
  </div>
  <div class="apihelp" data-i18n="captionWidthNote">只在没有原生字幕可对齐时生效：实时听译、以及仅翻译模式。</div>

  <div class="row">
    <label for="fontSize" data-i18n="fontSizePx">字号 (px)</label>
    <input type="number" id="fontSize" min="10" max="60" step="1" />
  </div>

  <div class="row">
    <label for="color" data-i18n="textColor">文字颜色</label>
    <input type="color" id="color" />
  </div>

  <div class="row">
    <label for="bgAlpha" data-i18n="bgOpacity">背景透明度</label>
    <input type="range" id="bgAlpha" min="0" max="100" step="1" />
  </div>

  <div class="status" id="status" data-i18n="loadingInfo">正在获取当前视频的字幕信息…</div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
